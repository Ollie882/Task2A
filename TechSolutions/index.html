<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechSolutions Intranet</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<style>
/* RESET & BASIC */
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:#f5f7fa;color:#111;transition:0.3s}
nav{background:#0d1117;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:15px 30px;position:sticky;top:0;z-index:100}
nav .logo{font-size:1.6rem;font-weight:bold}
nav button{margin-left:10px;padding:8px 15px;border:none;border-radius:6px;background:#1f2937;color:#fff;cursor:pointer;transition:0.2s}
nav button:hover{background:#2563eb}

/* SECTIONS */
section{display:none;padding:40px 30px;animation:fadeIn 0.5s ease forwards}
.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* DASHBOARD CARDS */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-top:20px}
.card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 5px 15px rgba(0,0,0,0.1);transition:0.3s;position:relative}
.card:hover{transform:translateY(-5px);box-shadow:0 10px 25px rgba(0,0,0,0.15)}
.card h3{margin-bottom:10px}
.card p{color:#555}

/* INPUTS & BUTTONS */
input, select, textarea{padding:10px;margin:5px 0;border-radius:6px;border:1px solid #ccc;width:100%;outline:none;transition:0.2s}
input:focus, select:focus, textarea:focus{border-color:#2563eb;box-shadow:0 0 5px rgba(37,99,235,0.5)}
button.action-btn{padding:8px 15px;border:none;border-radius:6px;background:#2563eb;color:#fff;cursor:pointer;transition:0.2s}
button.action-btn:hover{background:#1d4ed8}

/* CALENDAR */
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:20px}
.calendar-day{background:#fff;padding:10px;border-radius:6px;text-align:center;cursor:pointer;transition:0.2s}
.calendar-day.overdue{background:#f87171;color:#fff}
.calendar-day.upcoming{background:#fbbf24;color:#111}
.calendar-day.completed{background:#34d399;color:#fff}

/* NOTIFICATIONS */
.notification{background:#2563eb;color:#fff;padding:10px;border-radius:6px;margin-bottom:10px}
.notification.overdue{background:#f87171}

/* SEARCH BAR */
.search-bar{display:flex;gap:10px;margin-bottom:15px}
</style>
</head>
<body>

<nav>
  <div class="logo">TechSolutions Intranet</div>
  <div>
    <button onclick="show('dashboard')">Dashboard</button>
    <button onclick="show('maintenance')">Maintenance Log</button>
    <button onclick="show('scheduler')">Scheduler</button>
    <button onclick="show('notifications')">Notifications</button>
  </div>
</nav>

<!-- DASHBOARD -->
<section id="dashboard" class="active">
<h1>Maintenance Dashboard</h1>
<div class="cards-grid">
  <div class="card"><h3>Pending Tasks</h3><p id="pendingCount">0</p></div>
  <div class="card"><h3>Completed Tasks</h3><p id="completedCount">0</p></div>
  <div class="card"><h3>Overdue Tasks</h3><p id="overdueCount">0</p></div>
</div>
</section>

<!-- MAINTENANCE LOG -->
<section id="maintenance">
<h1>Maintenance Log</h1>
<div class="search-bar">
  <input id="searchEquip" placeholder="Search by equipment ID or service type" onkeyup="filterLog()">
</div>
<div id="maintenanceList" class="cards-grid"></div>
<h3>Add New Maintenance</h3>
<input id="equipId" placeholder="Equipment ID">
<input id="serviceType" placeholder="Service Type">
<textarea id="techNotes" placeholder="Technical Notes"></textarea>
<button class="action-btn" onclick="addMaintenance()">Add Entry</button>
</section>

<!-- SCHEDULER -->
<section id="scheduler">
<h1>Maintenance Scheduler</h1>
<div class="calendar" id="calendar"></div>
</section>

<!-- NOTIFICATIONS -->
<section id="notifications">
<h1>Notifications</h1>
<div id="notificationList"></div>
</section>

<script>
const SUPABASE_URL="YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY="YOUR_SUPABASE_ANON_KEY";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

// PAGE NAVIGATION
function show(page){
  document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
  document.getElementById(page).classList.add("active");
}

// LOAD MAINTENANCE LOG
async function loadMaintenance(){
  const {data}=await supabaseClient.from("maintenance").select("*");
  renderMaintenance(data);
  updateDashboard(data);
}

// RENDER MAINTENANCE CARDS
function renderMaintenance(data){
  const container=document.getElementById("maintenanceList");
  container.innerHTML="";
  data.forEach(d=>{
    container.innerHTML+=`
      <div class="card">
        <h3>${d.equipment_id} - ${d.service_type}</h3>
        <p>Date: ${d.date}</p>
        <p>${d.tech_notes}</p>
        <p>Status: ${d.status}</p>
      </div>`;
  });
}

// FILTER MAINTENANCE LOG
function filterLog(){
  const term=document.getElementById("searchEquip").value.toLowerCase();
  supabaseClient.from("maintenance").select("*").then(({data})=>{
    const filtered=data.filter(d=>d.equipment_id.toLowerCase().includes(term) || d.service_type.toLowerCase().includes(term));
    renderMaintenance(filtered);
  });
}

// ADD NEW MAINTENANCE ENTRY
async function addMaintenance(){
  const equipment_id=document.getElementById("equipId").value;
  const service_type=document.getElementById("serviceType").value;
  const tech_notes=document.getElementById("techNotes").value;
  const date=new Date().toISOString().split("T")[0];
  await supabaseClient.from("maintenance").insert([{equipment_id, service_type, tech_notes, date, status:"pending"}]);
  alert("Maintenance entry added!");
  loadMaintenance();
}

// DASHBOARD COUNTS
function updateDashboard(data){
  const pending=data.filter(d=>d.status==="pending").length;
  const completed=data.filter(d=>d.status==="completed").length;
  const overdue=data.filter(d=>d.status==="overdue").length;
  document.getElementById("pendingCount").innerText=pending;
  document.getElementById("completedCount").innerText=completed;
  document.getElementById("overdueCount").innerText=overdue;
}

// SIMPLE CALENDAR
function loadCalendar(){
  const container=document.getElementById("calendar");
  container.innerHTML="";
  for(let i=1;i<=30;i++){
    const day=document.createElement("div");
    day.className="calendar-day upcoming";
    day.innerText=i;
    container.appendChild(day);
  }
}

// LOAD NOTIFICATIONS
async function loadNotifications(){
  const {data}=await supabaseClient.from("maintenance").select("*");
  const container=document.getElementById("notificationList");
  container.innerHTML="";
  data.forEach(d=>{
    const overdueClass=d.status==="overdue"?"overdue":"";
    container.innerHTML+=`<div class="notification ${overdueClass}">${d.equipment_id} - ${d.service_type} (${d.status})</div>`;
  });
}

// INITIAL LOAD
loadMaintenance();
loadCalendar();
loadNotifications();
</script>

</body>
</html>
